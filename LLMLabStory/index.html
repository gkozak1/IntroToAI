<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LLMLab</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <h1>LLMLab</h1>
      <button class="btn primary" id="playStory">▶ Play the story</button>
    </header>
    <nav class="strip" id="strip" aria-label="The story"></nav>
    <main id="main">
      <div class="headline" id="headline"></div>
      <div class="toolbar" id="toolbar"></div>
      <div class="stage" id="stage"></div>
      <div class="stepbar">
        <button class="btn" id="prevBtn">◀ Back</button>
        <button class="btn primary" id="nextBtn">Next ▶</button>
        <span class="dots" id="dots"></span>
        <span class="status" id="status"></span>
      </div>
    </main>
  </div>
  <script src="./data/pack.js"></script>
  <script src="./js/core.js"></script>
  <script src="./js/live.js"></script>
  <script src="./js/meaning.js"></script>
  <script src="./js/story.js"></script>
</body>
</html>
