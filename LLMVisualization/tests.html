<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Next Token Lab — self tests</title>
  <link rel="stylesheet" href="./app.css" />
  <style>
    body { max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    .t { padding: .25rem .5rem; border-bottom: 1px solid var(--border); font-family: ui-monospace, monospace; font-size: .9rem; }
    .t.pass::before { content: "✓ "; color: var(--selected); }
    .t.fail { color: var(--stop); }
    .t.fail::before { content: "✗ "; }
    #summary { font-weight: 700; margin: 1rem 0; }
  </style>
</head>
<body>
  <h1>Teaching Model — self tests</h1>
  <p class="hint">Verifies the transparent math (softmax totals, temperature reshaping, cumulative intervals, sampling, logits, corpus counts). Open on the deployed site.</p>
  <div id="summary"></div>
  <div id="results"></div>

  <script type="module">
    import * as TM from "./js/teaching-model.js";
    const R = document.getElementById("results");
    let pass = 0, fail = 0;
    const approx = (a, b, e = 1e-9) => Math.abs(a - b) < e;
    function ok(name, cond) {
      const d = document.createElement("div");
      d.className = "t " + (cond ? "pass" : "fail");
      d.textContent = name;
      R.appendChild(d);
      cond ? pass++ : fail++;
    }

    let p = TM.softmax([1000, 1001, 1002]);
    ok("softmax sums to 1 (numerically stable)", approx(p.reduce((a, b) => a + b, 0), 1) && p.every(x => !Number.isNaN(x)));
    ok("softmax preserves order", p[2] > p[1] && p[1] > p[0]);

    const base = [2, 1, 0];
    ok("T<1 sharpens top token", TM.temperatureSoftmax(base, 0.5)[0] > TM.softmax(base)[0]);
    ok("T>1 flattens top token", TM.temperatureSoftmax(base, 2)[0] < TM.softmax(base)[0]);
    ok("temperature dist sums to 1", approx(TM.temperatureSoftmax(base, 1.5).reduce((a, b) => a + b, 0), 1));

    let threw = false; try { TM.temperatureSoftmax([1, 2], 0); } catch { threw = true; }
    ok("greedy is separate — T=0 throws, no divide-by-zero", threw);
    ok("greedy picks argmax", TM.greedyIndex([0.1, -3, 5, 2]) === 2);

    const probs = [0.5, 0.3, 0.2];
    const iv = TM.cumulativeIntervals(probs);
    ok("cumulative intervals start at 0 and end at 1", iv[0].start === 0 && approx(iv.at(-1).end, 1));
    ok("interval widths equal probabilities", iv.every((x, i) => approx(x.end - x.start, probs[i])));
    ok("r=0.4 selects token 1", TM.sampleWithR(probs, 0.4).index === 0);
    ok("r=0.5 selects token 2", TM.sampleWithR(probs, 0.5).index === 1);
    ok("r=0.999 selects last token", TM.sampleWithR(probs, 0.999).index === 2);

    const z = TM.outputLogits([[1, 0], [0, 1]], [3, 4], [1, -1]);
    ok("logits z = Wh+b computed correctly", z[0] === 4 && z[1] === 3);

    const w = TM.normalizeWeights([2, 1, 1]);
    ok("attention weights renormalize to sum 1", approx(w.reduce((a, b) => a + b, 0), 1) && approx(w[0], 0.5));
    const ctx = TM.weightedContext([0.5, 0.5], [[2, 0], [0, 4]]);
    ok("weighted context vector = Σ weight·value", ctx[0] === 1 && ctx[1] === 2);

    const corpus = ["the cat sat", "the cat ran", "the dog sat"];
    const r = TM.predictFromCorpus(corpus, "the cat", 3);
    ok("corpus trigram matches and normalizes", r.matched === 2 && approx(r.counts.find(c => c.token === "sat").p, 0.5));

    const tk = TM.teachingTokenize("unbelievable, hi");
    ok("teaching tokenizer emits fragment, punct, space", tk.some(t => t.kind === "fragment") && tk.some(t => t.kind === "punct") && tk.some(t => t.kind === "space"));

    const sum = document.getElementById("summary");
    sum.textContent = `${pass} passed, ${fail} failed`;
    sum.style.color = fail ? "var(--stop)" : "var(--selected)";
  </script>
</body>
</html>
