<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A four-class guided exploration of how large language models predict and select the next token.">
  <meta name="theme-color" content="#0f5d73">
  <title>The Next Token Lab</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to the activity</a>

  <header class="site-header">
    <div class="brand-block">
      <div class="brand-mark" aria-hidden="true">N</div>
      <div>
        <p class="eyebrow">Introduction to AI</p>
        <h1>The Next Token Lab</h1>
      </div>
    </div>
    <div class="header-actions">
      <button id="model-status-button" class="status-button" type="button" aria-haspopup="dialog">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="model-status-label">Real model not loaded</span>
      </button>
      <button id="teacher-nav-button" class="secondary-button" type="button">Teacher navigation</button>
      <button id="help-button" class="icon-button" type="button" aria-label="Open glossary and help">?</button>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar" aria-label="Course navigation">
      <nav id="class-navigation" class="class-navigation"></nav>
      <div class="sidebar-note">
        <strong>Progress stays on this browser.</strong>
        <span>No name or account is stored. School settings may clear browser data.</span>
      </div>
    </aside>

    <main id="main-content" class="main-content" tabindex="-1">
      <section id="process-map" class="process-map" aria-label="The complete next-token process"></section>
      <section id="screen-root" class="screen-root" aria-live="polite"></section>
    </main>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <dialog id="teacher-dialog" class="modal-dialog">
    <form method="dialog" class="dialog-shell">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Direct access</p>
          <h2>Teacher navigation</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="Close teacher navigation">×</button>
      </div>
      <div id="teacher-nav-content" class="dialog-content"></div>
      <div class="dialog-actions">
        <button id="reset-progress-button" class="danger-button" type="button">Reset all local progress</button>
        <button class="secondary-button" value="cancel">Close</button>
      </div>
    </form>
  </dialog>

  <dialog id="help-dialog" class="modal-dialog wide-dialog">
    <form method="dialog" class="dialog-shell">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Reference</p>
          <h2>Glossary and accuracy guide</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="Close glossary">×</button>
      </div>
      <div id="help-content" class="dialog-content"></div>
      <div class="dialog-actions">
        <button class="secondary-button" value="cancel">Close</button>
      </div>
    </form>
  </dialog>

  <dialog id="model-dialog" class="modal-dialog">
    <form method="dialog" class="dialog-shell">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Local browser inference</p>
          <h2>Real model status</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="Close model status">×</button>
      </div>
      <div id="model-dialog-content" class="dialog-content"></div>
      <div class="dialog-actions">
        <button id="load-model-dialog-button" class="primary-button" type="button">Load real model</button>
        <button class="secondary-button" value="cancel">Close</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
