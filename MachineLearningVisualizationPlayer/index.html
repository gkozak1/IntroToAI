<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Machine Learning Visualization Player</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <h1>Machine Learning Visualization Player</h1>
        <p>Watch a neural network improve its digit recognition over five conceptual training passes.</p>
      </div>
    </header>

    <section class="toolbar" aria-label="Visualization settings">
      <div class="control-block">
        <span class="control-label">Example</span>
        <div class="segmented" id="exampleButtons" aria-label="Choose number example">
          <button class="seg-btn active" data-example="9">Recognize 9</button>
          <button class="seg-btn" data-example="4">Recognize 4</button>
        </div>
      </div>

      <div class="control-block pass-block">
        <span class="control-label">Pass</span>
        <div class="segmented" id="passButtons" aria-label="Choose training pass">
          <button class="seg-btn active" data-pass="0">1</button>
          <button class="seg-btn" data-pass="1">2</button>
          <button class="seg-btn" data-pass="2">3</button>
          <button class="seg-btn" data-pass="3">4</button>
          <button class="seg-btn" data-pass="4">5</button>
        </div>
      </div>

      <div class="control-block speed-block">
        <label class="control-label" for="speedSlider">Speed <strong id="speedLabel">1.0×</strong></label>
        <input id="speedSlider" type="range" min="0.4" max="2" step="0.1" value="1" />
      </div>
    </section>

    <section class="status-row" aria-live="polite">
      <span class="status-pass" id="statusPass">Pass 1 of 5</span>
      <span class="status-dot">•</span>
      <span class="status-stage" id="statusStage">Forward propagation</span>
    </section>

    <section class="visual-wrap">
      <svg id="viz" viewBox="0 0 1280 720" role="img" aria-label="Neural network training visualization"></svg>
    </section>

    <section class="explanation" id="explanationBox">
      Existing parameters are used to calculate output neuron values
    </section>

    <section class="player-controls" aria-label="Playback controls">
      <button id="prevBtn" class="secondary">◀ Previous Step</button>
      <button id="nextBtn" class="primary">Next Step ▶</button>
      <button id="pauseBtn" class="secondary" disabled>Pause</button>
      <span class="divider" aria-hidden="true"></span>
      <button id="forwardBtn">Complete Forward Propagation</button>
      <button id="learningBtn">Complete Learning</button>
      <button id="backBtn">Complete Backward Propagation</button>
      <button id="passBtn">Complete Full Pass</button>
      <button id="trainingBtn">Complete Full Training</button>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
