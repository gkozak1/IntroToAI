<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Machine Learning Visualization Player</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="control-strip" aria-label="Visualization and playback controls">
      <div class="control-block example-block">
        <div class="segmented" id="exampleButtons" aria-label="Choose number example">
          <button class="seg-btn active" data-example="4">Recognize 4</button>
          <button class="seg-btn" data-example="9">Recognize 9</button>
        </div>
      </div>

      <div class="control-block pass-block">
        <span class="control-label">Pass</span>
        <div class="segmented" id="passButtons" aria-label="Choose training pass">
          <button class="seg-btn active" data-pass="0">1</button>
          <button class="seg-btn" data-pass="1">2</button>
          <button class="seg-btn" data-pass="2">3</button>
          <button class="seg-btn" data-pass="3">4</button>
          <button class="seg-btn" data-pass="4">5</button>
        </div>
      </div>

      <div class="control-block speed-block">
        <label class="control-label" for="speedSlider">Speed <strong id="speedLabel">1×</strong></label>
        <input id="speedSlider" type="range" min="0.5" max="2" step="0.5" value="1" list="speedStops" />
        <datalist id="speedStops">
          <option value="0.5" label="0.5×"></option>
          <option value="1" label="1×"></option>
          <option value="1.5" label="1.5×"></option>
          <option value="2" label="2×"></option>
        </datalist>
      </div>

      <span class="divider" aria-hidden="true"></span>

      <button id="prevBtn" class="control-btn secondary">◀ Previous Step</button>
      <button id="nextBtn" class="control-btn primary">Next Step ▶</button>
      <button id="pauseBtn" class="control-btn secondary" disabled>Pause</button>
      <button id="forwardBtn" class="control-btn" title="Complete Forward Propagation">Complete Forward</button>
      <button id="learningBtn" class="control-btn" title="Complete Learning">Complete Learning</button>
      <button id="backBtn" class="control-btn" title="Complete Backward Propagation">Complete Backward</button>
      <button id="passBtn" class="control-btn" title="Complete Full Pass">Full Pass</button>
      <button id="trainingBtn" class="control-btn" title="Complete Full Training">Full Training</button>
    </section>

    <section class="stage-line" aria-live="polite">
      <span class="status-pass" id="statusPass">Pass 1 of 5</span>
      <span class="status-dot">•</span>
      <strong class="status-stage" id="statusStage">Model inception</strong>
      <span class="status-separator">—</span>
      <span class="status-description" id="statusDescription">all parameters are randomly assigned at the beginning of Pass 1</span>
    </section>

    <section class="visual-wrap">
      <svg id="viz" viewBox="0 0 1280 720" role="img" aria-label="Neural network training visualization"></svg>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
