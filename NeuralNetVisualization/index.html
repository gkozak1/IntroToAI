<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Interactive neural-network forward propagation visualization for learning diagram, matrix mapping, and matrix math." />
  <title>Neural Net Visualization</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <div class="eyebrow">FORWARD PROPAGATION</div>
        <h1>Neural Net Visualization</h1>
        <p class="subtitle">One calculation. Two representations. Three steps.</p>
      </div>
      <div class="setup-panel" aria-label="Network setup">
        <div class="architecture-controls" id="architectureControls"></div>
        <div class="setup-actions">
          <button class="btn primary" id="buildBtn">Build Network</button>
          <button class="btn" id="generateBtn">Generate Values</button>
          <button class="btn" id="editBtn">Edit Values</button>
          <button class="btn ghost" id="resetBtn">Reset Work</button>
        </div>
      </div>
    </header>

    <section class="learning-bar">
      <nav class="step-nav" id="stepNav" aria-label="Instructional steps"></nav>
      <div class="guidance-control">
        <span class="guidance-label">Guidance</span>
        <div class="segmented" id="guidanceControl" role="group" aria-label="Guidance level">
          <button data-guidance="on" class="active">ON</button>
          <button data-guidance="off">OFF</button>
        </div>
      </div>
    </section>

    <main id="workspace" class="workspace" aria-live="polite"></main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
